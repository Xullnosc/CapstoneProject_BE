version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: capstone_be:local
    ports:
      - "8080:8080"
    environment:
      Redis__Connection: ${REDIS_CONNECTION:-redis:6379}
      Jwt__Key: ${JWT_KEY:-YourSuperSecretKeyForJWTTokenGenerationThatIsAtLeast32CharactersLong}
      Jwt__Issuer: ${JWT_ISSUER:-FCTMSBackend}
      Jwt__Audience: ${JWT_AUDIENCE:-FCTMSFrontend}
      ASPNETCORE_ENVIRONMENT: Development
      # Keep default environment unless you want Development mounted
      # ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./CapstoneProject_BE/appsettings.Development.json:/app/appsettings.Development.json:ro

volumes:
  redis-data:

# Notes:
# - Override credentials by setting `MYSQL_ROOT_PASSWORD`, `MYSQL_DATABASE`, and `JWT_KEY` in your environment or a .env file.
# - The app uses the `ConnectionStrings__capstoneDb` env var format so ASP.NET will bind it to `ConnectionStrings:capstoneDb`.
