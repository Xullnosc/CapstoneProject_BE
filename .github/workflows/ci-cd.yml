name: ASP.NET Web API CI (Test)

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

env:
  IMAGE_NAME: capstone_be
  CONTAINER_APP: fctmscontainerapp
  RESOURCE_GROUP: fctms_resourcegroup

jobs:
  build-test:
    runs-on: ubuntu-latest
    environment: Test
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.417"

      - name: Restore all projects
        run: dotnet restore

      - name: Build API (builds dependencies automatically)
        run: |
          dotnet build CapstoneProject_BE/capstone_be.csproj \
            --configuration Release \
            --no-restore

      - name: Test
        env:
          REDIS_CONNECTION: "localhost:6379,abortConnect=False"
        run: |
          echo "Waiting for Redis to be available..."
          sudo apt-get update -y && sudo apt-get install -y redis-tools
          for i in {1..30}; do
            if redis-cli -h localhost ping | grep -q PONG; then
              echo "Redis is up"; break
            fi
            echo "Redis not ready yet, waiting..."; sleep 1
          done
          dotnet test FCTMS.Tests/FCTMS.Tests.csproj \
            --configuration Release \
            --verbosity normal

  deploy-test:
    needs: build-test
    runs-on: ubuntu-latest
    environment: Test

    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Docker ----
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}"
          SHA_TAG="${IMAGE}:${{ github.sha }}"
          LATEST_TAG="${IMAGE}:latest"

          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "${SHA_TAG}" \
            -t "${LATEST_TAG}" \
            .

          docker push "${SHA_TAG}"
          docker push "${LATEST_TAG}"

      # ---- Azure ----
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify deployment
        run: |
          echo "=== Waiting for new revision to become active ==="
          for i in $(seq 1 30); do
            ACTIVE_IMAGE=$(az containerapp show \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.template.containers[0].image" \
              --output tsv)

            echo "Attempt ${i}/30 — Active image: ${ACTIVE_IMAGE}"

            if echo "${ACTIVE_IMAGE}" | grep -q "${{ github.sha }}"; then
              echo "Deployment verified — running image matches commit SHA."
              exit 0
            fi

            sleep 10
          done

          echo "::error::Deployment verification timed out. Expected SHA ${{ github.sha }} but got ${ACTIVE_IMAGE}"
          exit 1

      - name: Show revision details on failure
        if: failure()
        run: |
          echo "=== Active Revisions ==="
          az containerapp revision list \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --output table

          echo ""
          echo "=== Container App Logs (last 50 lines) ==="
          az containerapp logs show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --type system \
            --tail 50 || echo "Could not fetch logs"
